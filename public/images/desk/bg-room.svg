<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3228"/>
      <stop offset="55%" stop-color="#1e241c"/>
      <stop offset="100%" stop-color="#141810"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c4883a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c4883a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- wood panels -->
  <g stroke="#0e120e" stroke-width="3" opacity="0.45">
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>
  <!-- curtain -->
  <path d="M1280 0 L1600 0 L1600 900 L1320 900 Z" fill="#3a2a28" opacity="0.85"/>
  <g stroke="#2a1a18" stroke-width="18" opacity="0.35">
    <line x1="1340" y1="0" x2="1360" y2="900"/>
    <line x1="1400" y1="0" x2="1420" y2="900"/>
    <line x1="1460" y1="0" x2="1480" y2="900"/>
    <line x1="1520" y1="0" x2="1540" y2="900"/>
  </g>
  <rect width="1600" height="900" fill="url(#glow)"/>
</svg>
